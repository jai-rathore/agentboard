# Free Cloudflare Worker: keep the free Render services warm and probe the live MCP. Deploy: npx wrangler deploy
# (from this directory, after `npx wrangler login` and creating the KV namespace below). No secrets are needed.
name = "agentboard-keepwarm"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
API_URL = "https://agentboard-api.onrender.com"
EXECUTOR_URL = "https://agentboard-executor.onrender.com"
# America/Los_Angeles hours, end exclusive ("*" = always, "" = never). Render free = 750 instance-hours per month per
# WORKSPACE, shared by the free services (agentboard-api and personal-web-agent; the executor is on a paid plan since
# Oct 30, so pinging it costs no free hours and it never sleeps). 6-24 for the API = ~540 h in a 30-day month.
API_WARM_WINDOWS = "6-24"
EXECUTOR_WARM_WINDOWS = "10-14"
PROBE_SLUG = "hacker-news-top-story"
PROBE_PARAMS = "{}"
# try_skill first step (a challenge, no replay, no Muse calls; it makes the API wake the executor): every 30 min inside
# EXECUTOR_WARM_WINDOWS, every 3 h outside it.
PROBE_TRY_EVERY_MIN = "30"
PROBE_TRY_OFF_WINDOW_EVERY_MIN = "180"
TIMEOUT_MS = "70000"
# Filming (Nov 1-2) and judging: both services warm around the clock until this time (midnight PST starting Nov 8),
# then the windows above apply again by themselves. API 24/7 Oct 30-Nov 7 + 6-24 after = ~600 h in November.
ALWAYS_WARM_UNTIL = "2026-11-08T00:00:00-08:00"

[[kv_namespaces]]
binding = "STATUS"
id = "97b1c92b55a0496f85ea11521898d937"
