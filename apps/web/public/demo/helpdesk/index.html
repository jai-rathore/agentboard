<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Helpdesk (Agentboard Skills demo)</title><meta name="robots" content="noindex">
<style>body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f5f7}header{background:#1f3a93;color:#fff;padding:14px 24px;font-size:20px}
nav{display:inline-block;margin-left:40px;font-size:14px}nav a{color:#cfd8ff;margin-right:18px;text-decoration:none}
main{max-width:560px;margin:30px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 4px #0002}
label{display:block;margin-top:14px;font-size:14px;color:#333}input,select,textarea{width:100%;padding:8px;margin-top:4px;font-size:14px;box-sizing:border-box;font-family:inherit}
button{margin-top:18px;background:#1f3a93;color:#fff;border:0;padding:10px 22px;font-size:15px;border-radius:4px;cursor:pointer}
#ok{display:none;margin-top:16px;background:#e3f7e8;color:#145a2a;padding:12px;border-radius:4px}.err{color:#a40000;font-size:13px;margin-top:8px}
.note{max-width:560px;margin:10px auto;color:#888;font-size:12px;text-align:center}.note a{color:#888}.note a.on{font-weight:bold;color:#333}
body.v2{background:#f1f6f2}body.v2 header{background:#0f6b4a}body.v2 main{max-width:620px;border-top:4px solid #0f6b4a}.bar{display:flex;justify-content:space-between;align-items:center}
body.v2 button{background:#18a058;margin-top:0;padding:8px 18px;border-radius:18px}</style></head>
<body><header>Acme Helpdesk<nav><a href="./">New ticket</a><a href="status.html">Ticket status</a><a href="#">Reports</a></nav></header>
<main><h2 style="margin-top:0">New support ticket</h2>
<label>Customer email<input id="email" placeholder="name@example.com" autocomplete="off"></label>
<label>Subject<input id="subject" placeholder="Short summary" autocomplete="off"></label>
<label>Priority<select id="prio"><option>Low</option><option selected>Normal</option><option>High</option><option>Urgent</option></select></label>
<label>Description<textarea id="desc" rows="3"></textarea></label>
<button id="submit" type="button">Create ticket</button><div id="err" class="err"></div>
<div id="ok"></div></main>
<p class="note">Mock site for the Agentboard Skills demo. Nothing is sent anywhere. Layout: <a href="?v=1" id="v1">classic</a> · <a href="?v=2" id="v2">redesign</a></p>
<script src="app.js"></script></body></html>
