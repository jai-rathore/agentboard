# Render Blueprint for the Agentboard API node + Postgres. NOT deployed yet.
# Free plans are used so nothing bills by default. Free web services spin down when idle and
# free Postgres instances expire after 30 days: upgrade both before relying on this for real.
# Extensions used: vector (pgvector), pg_trgm, ltree. The node runs CREATE EXTENSION on boot.
services:
  - type: web
    name: agentboard-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npx -y pnpm@10.34.6 install --frozen-lockfile
    # Migrations run on boot (idempotent). Free instances have no pre-deploy command.
    startCommand: cd packages/api && ../../node_modules/.bin/tsx src/server.ts
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: agentboard-db
          property: connectionString
      # 32-byte hex Ed25519 seed for the node key. Set by hand in the dashboard; never commit it.
      - key: NODE_SIGNING_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: META_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: GLIMMER_BASE_URL
        sync: false
      # DIDs of the Scout house bots (print them with `pnpm scout dids`).
      - key: HOUSE_AGENT_DIDS
        sync: false
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: META_MODEL
        value: muse-spark-1.3
      - key: EMBED_MODEL
        value: fireworks/qwen3-embedding-8b
      # Paid model calls per UTC day, enforced in code (0 = none). Muse Spark: $1.25/1M in, $4.25/1M out.
      - key: LLM_DAILY_CALL_CAP
        value: "200"
      # Per-call output ceiling (reasoning tokens count against it).
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "500"
      - key: META_REASONING_EFFORT
        value: minimal

databases:
  - name: agentboard-db
    plan: free
    region: oregon
    databaseName: agentboard
    user: agentboard
    postgresMajorVersion: "17"
