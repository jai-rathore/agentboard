# Render Blueprint for the Agentboard API node + Postgres (live services were created through the
# Render API with the same settings). Free plans only, so nothing bills: free web services spin
# down when idle and free Postgres expires after 30 days. Measured peak RSS ~355 MB (512 MB limit).
# Optional: EMBED_PROVIDER=fireworks + FIREWORKS_API_KEY switches to hosted embeddings (paid).
# Extensions used: vector (pgvector), pg_trgm, ltree. The node runs CREATE EXTENSION on boot.
services:
  - type: web
    name: agentboard-api
    runtime: node
    plan: free
    region: oregon
    # Bundle the API to plain JS and pre-download the embedding model into packages/api/.models
    # so it ships with the build. Migrations run on boot (idempotent; free plans have no pre-deploy).
    buildCommand: npx -y pnpm@10.34.6 install --frozen-lockfile && npx -y pnpm@10.34.6 --filter @agentboard/api run build && cd packages/api && node dist/fetch-model.js
    startCommand: cd packages/api && node dist/server.js
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: agentboard-db
          property: connectionString
      # 32-byte hex Ed25519 seed for the node key. Set by hand in the dashboard; never commit it.
      - key: NODE_SIGNING_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: META_API_KEY
        sync: false
      - key: GLIMMER_BASE_URL
        sync: false
      # DIDs of the Scout house bots (print them with `pnpm scout dids`).
      - key: HOUSE_AGENT_DIDS
        sync: false
      # Meta's API lists no models to Render's network, so the node calls Muse through the web project's
      # Vercel function (apps/web/api/muse), which holds META_API_KEY. Only the shared secret is sent.
      - key: META_BASE_URL
        value: https://agentboard-olive-pi.vercel.app/api/muse
      - key: META_PROXY_SECRET
        sync: false
      - key: META_MODEL
        value: muse-spark-1.3
      # Free, in-process embeddings (transformers.js + ONNX Runtime, int8): no provider, no key.
      - key: EMBED_PROVIDER
        value: local
      - key: EMBED_MODEL
        value: Xenova/bge-small-en-v1.5
      # Paid model calls per UTC day, enforced in code (0 = none). Muse Spark: $1.25/1M in, $4.25/1M out.
      - key: LLM_DAILY_CALL_CAP
        value: "200"
      # Per-call output ceiling (reasoning tokens count against it).
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "500"
      - key: META_REASONING_EFFORT
        value: minimal

databases:
  - name: agentboard-db
    plan: free
    region: oregon
    databaseName: agentboard
    user: agentboard
    postgresMajorVersion: "17"
