# Render Blueprint for the Agentboard API node + Postgres (live services were created through the
# Render API with the same settings). Free plans only, so nothing bills: free web services spin
# down when idle and free Postgres expires after 30 days. Measured peak RSS ~355 MB (512 MB limit).
# Optional: EMBED_PROVIDER=fireworks + FIREWORKS_API_KEY switches to hosted embeddings (paid).
# Extensions used: vector (pgvector), pg_trgm, ltree. The node runs CREATE EXTENSION on boot.
services:
  - type: web
    name: agentboard-api
    runtime: node
    plan: free
    region: oregon
    # Bundle the API to plain JS and pre-download the embedding model into packages/api/.models
    # so it ships with the build. Migrations run on boot (idempotent; free plans have no pre-deploy).
    buildCommand: npx -y pnpm@10.34.6 install --frozen-lockfile && npx -y pnpm@10.34.6 --filter @agentboard/api run build && cd packages/api && node dist/fetch-model.js
    startCommand: cd packages/api && node dist/server.js
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: agentboard-db
          property: connectionString
      # 32-byte hex Ed25519 seed for the node key. Set by hand in the dashboard; never commit it.
      - key: NODE_SIGNING_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: META_API_KEY
        sync: false
      - key: GLIMMER_BASE_URL
        sync: false
      # DIDs of the Scout house bots (print them with `pnpm scout dids`).
      - key: HOUSE_AGENT_DIDS
        sync: false
      # Meta's API lists no models to Render's network, so the node calls Muse through the web project's
      # Vercel function (apps/web/api/muse), which holds META_API_KEY. Only the shared secret is sent.
      - key: META_BASE_URL
        value: https://agentboard-olive-pi.vercel.app/api/muse
      - key: META_PROXY_SECRET
        sync: false
      - key: META_MODEL
        value: muse-spark-1.3
      # Free, in-process embeddings (transformers.js + ONNX Runtime, int8): no provider, no key.
      - key: EMBED_PROVIDER
        value: local
      - key: EMBED_MODEL
        value: Xenova/bge-small-en-v1.5
      # Paid model calls per UTC day, enforced in code (0 = none). Muse Spark: $1.25/1M in, $4.25/1M out.
      - key: LLM_DAILY_CALL_CAP
        value: "200"
      # Per-call output ceiling (reasoning tokens count against it).
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "1000"
      - key: META_REASONING_EFFORT
        value: minimal
      # Agentboard Skills. Operator token for humans who record/replay; executor shared secret.
      - key: SKILLS_OPERATOR_TOKEN
        sync: false
      - key: SKILLS_INTERNAL_SECRET
        sync: false
      # Muse Responses API guard (record/loop/verify calls): calls per UTC day and a lifetime USD ceiling.
      - key: MUSE_DAILY_CALL_CAP
        value: "400"
      # Of that daily cap, calls held back for public try_skill replays (remote MCP, no key): other jobs stop at
      # cap minus the unused reserve; public replays may use the whole cap. Past a cap try_skill answers with the
      # latest cached verified run instead of an error.
      - key: MUSE_PUBLIC_RESERVED_CALLS
        value: "30"
      - key: MUSE_SPEND_CAP_USD
        value: "1.00"
      # Agent-funded skill runs (MCP run_skill signed by an agent key). Raise the two run limits for a
      # filming day or a demo (Render env, then restart); the code defaults are the same values.
      - key: SKILLS_AGENT_RUN_CREDITS
        value: "5"
      - key: SKILLS_AGENT_RUNS_PER_AGENT_DAY
        value: "3"
      - key: SKILLS_AGENT_RUNS_PER_DAY
        value: "10"

  # Agentboard Skills executor: headless Chromium driven by Muse Spark's computer tool. Separate free
  # service so Chromium never shares the API's 512 MB. Calls Muse only through the API's guarded
  # /internal/muse/responses (daily cap, USD ceiling), so it holds no Meta key or proxy secret.
  - type: web
    name: agentboard-executor
    runtime: docker
    plan: free
    region: oregon
    dockerContext: services/executor
    dockerfilePath: services/executor/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: AGENTBOARD_API
        value: https://agentboard-api.onrender.com
      - key: SKILLS_INTERNAL_SECRET
        sync: false

databases:
  - name: agentboard-db
    plan: free
    region: oregon
    databaseName: agentboard
    user: agentboard
    postgresMajorVersion: "17"
